<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="nibGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Rounded Icon Container -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Subtle Page Outline in background -->
  <rect x="26" y="24" width="76" height="80" rx="8" fill="#FFFFFF" fill-opacity="0.12"/>

  <!-- Fountain Pen Nib -->
  <g transform="translate(64, 60)">
    <!-- Nib Body -->
    <path d="M 0 -36 
             C 14 -16, 22 2, 20 22 
             C 18 28, 8 32, 0 34 
             C -8 32, -18 28, -20 22 
             C -22 2, -14 -16, 0 -36 Z" 
          fill="url(#nibGrad)"/>
    
    <!-- Gold Collar Band -->
    <path d="M -17 18 C -8 24, 8 24, 17 18 L 19 23 C 8 30, -8 30, -19 23 Z" fill="url(#goldGrad)"/>

    <!-- Slit and Breather Hole -->
    <line x1="0" y1="-34" x2="0" y2="4" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="5" r="3.5" fill="#1E293B"/>

    <!-- Ink drop at the tip -->
    <path d="M 0 -38 C -4 -43, -6 -47, -6 -50 C -6 -53.3, -3.3 -56, 0 -56 C 3.3 -56, 6 -53.3, 6 -50 C 6 -47, 4 -43, 0 -38 Z" 
          fill="#60A5FA"/>
  </g>
</svg>
